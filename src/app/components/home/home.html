<section class="intro">
  <article id="Home">
    <p class="name">Stefan Carpeliuc</p>
    <h1>
      {{intro()[0]}}
    </h1>
    <app-separation-line></app-separation-line>
    <p class="description" [innerHTML]="intro()[1]">
      
    </p>
  </article>

  <iframe src="https://www.youtube.com/embed/HwmZbkaUvXQ?si=D7Q2si28b58GthLb">
  </iframe>
</section>

<section id="AboutMe">
  <article>
    <h2>About me</h2>
    <div [innerHTML]="aboutHtml()"></div>
  </article>
  <aside>
    <figure class="glossy-container">
      <img ngSrc="assets/Images/MyPortrait2.JPG" alt="" height="4608" width="3456">
      <div class="glossy-shine"></div>
    </figure>
  </aside>
</section>

<main>
  <h1 id="Projects">Projects</h1>
  <app-separation-line></app-separation-line>
  @for (card of cards(); track $index) {
    <app-project-card
    [title]="card.title"
    [description]="card.description"
    [imagePath]="card.imagePath"
    [route]="card.route"
    ></app-project-card>
  }
</main>



<section id="tools">
  <h2 >Tools and skills</h2>
  <ul>
    @for (tool of tools; track $index) {
      <li><img class="btn" [src]="tool.imagePath" alt="{{tool.alt}}"></li>
    }
  </ul>
</section>
<div id="Contact"></div>
<app-contact-card  scrollScale></app-contact-card>
